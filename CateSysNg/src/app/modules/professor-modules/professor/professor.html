<!-- Cabeçalho -->
<div class="page-header">
  <h2>Alunos</h2>
</div>

<!-- Card principal -->
<div class="alunos-card">

  <!-- Filtros -->
  <form class="filtros" [formGroup]="form" (ngSubmit)="carregarDados()">

    <div class="form-field">
      <label for="nome">Nome</label>

      <input id="nome" class="input-field" type="text" formControlName="nome" placeholder="Digite o nome" #inputNome
        (input)="pesquisar(inputNome.value,  inputMatricular.value)"
        (keyup.enter)="pesquisar(inputNome.value,  inputMatricular.value)">
    </div>

    <div class="form-field">
      <label for="matricula">Matrícula</label>

      <input id="matricula" class="input-field" type="number" formControlName="matricula"
        placeholder="Digite a matrícula" #inputMatricular (input)="pesquisar(inputNome.value,  inputMatricular.value)"
        (keyup.enter)="pesquisar(inputNome.value,  inputMatricular.value)">
    </div>

    <div class="form-action">
      <button id="btn" class="btn-primary" type="submit" (click)="pesquisar(inputNome.value, inputMatricular.value)">
        Pesquisar
      </button>
    </div>
    
    <div class="form-action">
      <button id="btn" class="btn-primary" icon="pi pi-plus" type="button" (click)="add()">
        +
      </button>
    </div>

  </form>


  <!-- Tabela -->
  <div class="tabela-container">

    <p-table [value]="professorsFiltrados" [tableStyle]="{ 'min-width': '50rem' }">

      <ng-template pTemplate="header">
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Status</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-aluno>
        <tr (dblclick)="selecionado(aluno)">
          <td>{{ aluno.matricula }}</td>
          <td>{{ aluno.nome }}</td>
          <td>{{ aluno.status }}</td>
        </tr>
      </ng-template>

    </p-table>

  </div>


  <!-- Rodapé -->
  <div class="table-footer">

    <span>
      Total de registros encontrados:
      <strong>{{ listprofessors.length }}</strong>
    </span>

    <span>
      Máx. de linhas:
      <strong>{{ listprofessors.length }}</strong>
    </span>

  </div>

</div>
<app-pops [(visivel)]="exibirModalPrincipal" (visivelChange)="retornoPopUp($event)"  [Selecionado]="professorSelecionado">

</app-pops>
