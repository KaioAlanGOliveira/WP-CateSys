<!-- Cabeçalho -->
<div class="page-header">
  <h2>Alunos</h2>
</div>

<!-- Card principal -->
<div class="alunos-card">

  <!-- Filtros -->
  <form
    class="filtros"
    [formGroup]="form"
    (ngSubmit)="pesquisar()"
  >

    <div class="form-field">
      <label for="nome">Nome</label>

      <input
        id="nome"
        class="input-field"
        type="text"
        formControlName="nome"
        placeholder="Digite o nome"
      >
    </div>

    <div class="form-field">
      <label for="matricula">Matrícula</label>

      <input
        id="matricula"
        class="input-field"
        type="number"
        formControlName="matricula"
        placeholder="Digite a matrícula"
      >
    </div>

    <div class="form-action">
      <button
        id="btn"
        class="btn-primary"
        type="submit"
      >
        Pesquisar
      </button>
    </div>

  </form>


  <!-- Tabela -->
  <div class="tabela-container">

    <p-table
      [value]="listAlunos"
      [tableStyle]="{ 'min-width': '50rem' }"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Turma</th>
          <th>Status</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-aluno>
        <tr>
          <td>{{ aluno.matricula }}</td>
          <td>{{ aluno.nome }}</td>
          <td>{{ aluno.turma }}</td>
          <td>{{ aluno.status }}</td>
        </tr>
      </ng-template>

    </p-table>

  </div>


  <!-- Rodapé -->
  <div class="table-footer">

    <span>
      Total de registros encontrados:
      <strong>{{ listAlunos.length }}</strong>
    </span>

    <span>
      Máx. de linhas:
      <strong>{{ listAlunos.length }}</strong>
    </span>

  </div>

</div>
