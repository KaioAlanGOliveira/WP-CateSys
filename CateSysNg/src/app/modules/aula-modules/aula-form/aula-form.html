<p-dialog header="Cadastro das Aulas" [(visible)]="visivel" (onHide)="fecharModal()" [modal]="true"
  [style]="{ width: '900px', height: '60vh' }">
  <form [formGroup]="formulario">

    <div class="campos">

      <div class="mensagem">
        @if (formulario.invalid && formulario.touched) {
        <p-message severity="error" icon="pi pi-times-circle" styleClass="mb-2">
          A validação falhou!
        </p-message>
        }
      </div>

      <!-- Codigo -->
      <div class="campo">
        <label>Código</label>
        <input pInputText formControlName="codigo" placeholder="Codigo" [disabled]="false" readonly />
      </div>


      <!-- Turma -->
      <div class="campo">
        <label>Turma</label>
        <cmp-componente-turma inputId="codAluno" cmpProximoCampo="bt-add" #pesqTurma formControlName="turmaCodigo"></cmp-componente-turma>
      </div>

      <!-- Data -->
      <div class="campo">
        <label for="date">Data</label>

        <input id="date" type="date" formControlName="data" class="input-field">
      </div>

      <!-- Tabela Alunos -->
      <div class="tabela-container">

        <p-table [value]="listTAluno" [tableStyle]="{ 'min-width': '50rem' }">

          <ng-template pTemplate="header">
            <tr>
              <th>Matrícula</th>
              <th>nome</th>
              <th>Presença</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-aluno>
            <tr (click)="selecionado(aluno)">
              <td>{{ aluno.matricula }}</td>
              <td>{{ aluno.nome }}</td>
               <p-tableCheckbox [value]="aluno"></p-tableCheckbox>
            </tr>
          </ng-template>

        </p-table>

      </div>
      <!-- Rodapé -->
      <div class="table-footer">

        <span>
          Total de registros encontrados:
          <strong>{{ listTAluno.length }}</strong>
        </span>

        <span>
          Máx. de linhas:
          <strong>{{ listTAluno.length }}</strong>
        </span>

      </div>
    </div>



    <!-- BLOCO DA DIREITA: BOTÕES (180px) -->
    <div class="acoes">
      <p-button label="Novo" [disabled]="!novoHabilitado" (onClick)="novo()"></p-button>
      <p-button label="Alterar" [disabled]="!alterarHabilitado" (onClick)="editar()"></p-button>
      <br>
      <p-button label="Salvar" [disabled]="!salvarHabilitado" (onClick)="salvar()"></p-button>
      <p-button label="Cancelar" [disabled]="!cancelarHabilitado" (onClick)="cancelar()"></p-button>
      <br>
      <p-button label="Apagar" [disabled]="!apagarHabilitado" (onClick)="apagar()"></p-button>
      <p-button label="Fechar" [disabled]="!fecharHabilitado" (onClick)="fecharModal()"></p-button>
    </div>

  </form>
</p-dialog>
