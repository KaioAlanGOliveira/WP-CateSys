<p-dialog header="Cadastro de Aula" [(visible)]="visivel" (onHide)="fecharModal()" [modal]="true"
  [style]="{ width: '900px' }">
  <!-- Cabeçalho -->
  <div class="page-header">
    <h2>Aula</h2>
  </div>

  <!-- Card principal -->
  <div class="alunos-card">

    <form class="filtros" [formGroup]="form" (ngSubmit)="carregarDados()">

      <!-- Turma -->
      <div class="campo">
        <label for="turma">Turma</label>

        <cmp-componente-turma inputId="turmaCodigo" cmpProximoCampo="data" #pesqTurma formControlName="turmaCodigo">
        </cmp-componente-turma>
      </div>

      <!-- Data -->
      <div class="campo">
        <label for="data">Data</label>

        <input id="data" type="date" formControlName="data" class="input-field">
      </div>

      <!-- Botões -->
      <div class="acoes">

        <button type="button" (click)="cancelar()">
          Cancelar
        </button>

        <button (click)="criar()">
          Criar
        </button>

      </div>

    </form>

  </div>
</p-dialog>
