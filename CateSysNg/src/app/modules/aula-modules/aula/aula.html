<p-dialog header="Cadastro das Turmas" [(visible)]="visivel" (onHide)="fecharModal()" [modal]="true"
  [style]="{ width: '900px', height: '60vh' }">

  <form [formGroup]="form">

    <!-- Turma -->
    <div class="campo">
      <label for="turma">Turma</label>

      <select id="turma" formControlName="turmaCodigo" class="input-field">

        <option [ngValue]="null">
          Selecione uma turma
        </option>

        <option *ngFor="let turma of turmas" [ngValue]="turma.codigo">

          {{ turma.nome }}

        </option>

      </select>
    </div>

    <!-- Data -->
    <div class="campo">
      <label for="data">Data</label>

      <input id="data" type="date" formControlName="data" class="input-field">
    </div>

    <!-- Botões -->
    <div class="acoes">

      <button type="button" (click)="fecharModal()">

        Cancelar

      </button>

      <button type="button" (click)="criar()">

        Criar

      </button>

    </div>

  </form>

</p-dialog>
