<p-dialog header="Cadastro das Turmas" [(visible)]="visivel" (onHide)="fecharModal()" [modal]="true"
  [style]="{ width: '900px', height: '60vh' }">

  <form [formGroup]="form">

    <!-- Turma -->
    <div class="campo">
      <label for="turma">Turma</label>
      <input id="turma" type="text" formControlName="turmaCodigo" class="input-field">
    </div>

    <!-- Data -->
    <div class="campo">
      <label for="data">Data</label>

      <input id="data" type="date" formControlName="data" class="input-field">
    </div>

    <!-- Botões -->
    <div class="acoes">

      <button type="button" (click)="fecharModal()">

        Cancelar

      </button>

      <button type="button" (click)="criar()">

        Criar

      </button>

    </div>

  </form>

</p-dialog>

<app-aula-form [(visivel)]="exibirModal" (visivelChange)="retornoPopUp($event)" [Selecionado]="aulaSelecionado"></app-aula-form>
