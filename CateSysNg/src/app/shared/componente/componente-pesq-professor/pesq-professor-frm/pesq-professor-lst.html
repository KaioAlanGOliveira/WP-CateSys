<form [formGroup]="formAluno">

    <!-- Matrícula -->
    <div class="form-field">
        <label for="matricula">Matrícula</label>

        <p-inputNumber id="matricula" formControlName="matricula">
        </p-inputNumber>
    </div>


    <!-- Nome -->
    <div class="form-field">
        <label for="nome">Nome</label>

        <input type="text" pInputText formControlName="nome" placeholder="Nome do aluno">
    </div>


    <!-- Botão pesquisar -->
    <div class="flex align-items-center justify-content-end">
        <button pButton id="btn-pesq" type="button" [icon]="loading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
            [disabled]="loading" (click)="pesquisar()" label="Pesquisar" class="font-medium">
        </button>
    </div>

</form>


<p-table [value]="lista" sortMode="multiple" [resizableColumns]="true" [rowHover]="true"
      [(selection)]="selectedItem" selectionMode="single" [rows]="25">
    <ng-template pTemplate="header">
        <tr>
            <th>
                Matrícula
            </th>

            <th>
                Nome
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-aluno>
        <tr [pSelectableRow]="aluno" (dblclick)="ref.close(aluno.matricula)">
            <td>{{ aluno.matricula }}</td>
            <td>{{ aluno.nome }}</td>
            <h1></h1>      
        </tr>
    </ng-template>
</p-table>
<div class="flex align-items-center justify-content-between">
    <span class="font-medium font-italic">Total de registros encontrados: {{lista.length}}</span>
</div>
