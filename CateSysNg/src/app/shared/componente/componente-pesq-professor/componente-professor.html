<div class="flex gap-3">
    <form [formGroup]="form" class="p-inputgroup" >
        <p-inputNumber #input class="input-code" [disabled]="disabled ?? false" formControlName="matricula" (keydown)="keydown($event)" (onInput)="limpar()" >
        </p-inputNumber>

        <input class="input-text" pInputText formControlName="nome" [disabled]="disabled ?? false" aria-hidden style="width: 150px;" readonly />

        <button type="button" pButton pRipple [disabled]="disabled ?? false" [icon]="loading ? 'pi pi-spin pi-spinner':'pi pi-search'" (click)="show()" aria-hidden></button>
    </form>
</div>
