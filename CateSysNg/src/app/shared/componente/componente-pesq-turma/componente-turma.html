<div class="flex gap-3">
    <form [formGroup]="form" class="p-inputgroup" >
        <p-inputNumber #input class="input-code"  style="width: 350px;"  [disabled]="disabled ?? false" formControlName="codigo" (keydown)="keydown($event)" (onInput)="limpar()"  [useGrouping]="false" >
        </p-inputNumber>

        <input class="input-text" pInputText formControlName="nome"  [disabled]="disabled ?? false" aria-hidden style="width: 270px; margin: 2px;"  readonly />

        <button type="button" pButton pRipple  [disabled]="disabled ?? false" [icon]="loading ? 'pi pi-spin pi-spinner':'pi pi-search'" style="margin-left: 2px;" (click)="show()" aria-hidden></button>
    </form>
</div>
