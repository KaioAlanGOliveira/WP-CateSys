<div class="flex gap-3">
    <form [formGroup]="form" class="p-inputgroup" >
        <p-inputNumber #input class="input-code"  style="width: 350px;" [disabled]="false" formControlName="codigo" (keydown)="keydown($event)" (onInput)="limpar()" readonly [useGrouping]="false" >
        </p-inputNumber>

        <input class="input-text" pInputText formControlName="nome" [disabled]="false" aria-hidden style="width: 270px; margin: 2px;"  readonly />

        <button type="button" pButton pRipple [disabled]="false" [icon]="loading ? 'pi pi-spin pi-spinner':'pi pi-search'" style="margin-left: 2px;" (click)="show()"readonly aria-hidden></button>
    </form>
</div>
