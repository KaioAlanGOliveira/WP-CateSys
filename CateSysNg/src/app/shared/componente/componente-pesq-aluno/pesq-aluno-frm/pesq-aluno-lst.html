<form [formGroup]="formAluno" class="flex flex-column gap-3">
  <div class="flex justify-content-end">
    <button pButton type="button" icon="pi pi-times" label="Fechar" (click)="fechar()"></button>
  </div>

  <div class="field">
    <label for="matricula">Matrícula</label>
    <p-inputNumber id="matricula" formControlName="matricula"></p-inputNumber>
  </div>

  <div class="field">
    <label for="nome">Nome</label>
    <input id="nome" type="text" pInputText formControlName="nome" placeholder="Nome do aluno">
  </div>

  <div class="flex justify-content-end">
    <button pButton id="btn-pesq" type="button" [icon]="loading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
      [disabled]="loading" (click)="pesquisar()" label="Pesquisar"></button>
  </div>
</form>

<p-table [value]="lista" [scrollable]="true" [rows]="20" [rowHover]="true" [(selection)]="selectedItem"
  selectionMode="single" dataKey="matricula">
  <ng-template pTemplate="header">
    <tr>
      <th>Matrícula</th>
      <th>Nome</th>
      <th>Status</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-entity>
    <tr [pSelectableRow]="entity" (dblclick)="selecionar()">
      <td>{{ entity.matricula }}</td>
      <td>{{ entity.nome }}</td>
      <td>{{ entity.status }}</td>
    </tr>
  </ng-template>
</p-table>

<div class="flex align-items-center justify-content-between mt-3">
  <span>Total de registros encontrados: {{ lista.length }}</span>
  <button pButton label="Selecionar" (click)="selecionar()"></button>
</div>
