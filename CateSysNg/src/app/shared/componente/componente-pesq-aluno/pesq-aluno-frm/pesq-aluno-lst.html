<form [formGroup]="formAluno">

    <!-- Matrícula -->
    <div class="form-field">
        <label for="matricula">Matrícula</label>

        <p-inputNumber id="matricula" formControlName="matricula" [useGrouping]="false">
        </p-inputNumber>
    </div>


    <!-- Nome -->
    <div class="form-field">
        <label for="nome">Nome</label>

        <input id="nome" type="text" pInputText formControlName="nome" placeholder="Nome do aluno">
    </div>


    <!-- Telefone -->
    <div class="form-field">
        <label for="telefone">Telefone</label>

        <input id="telefone" type="text" pInputText formControlName="telefone" placeholder="Telefone">
    </div>


    <!-- Nome do responsável -->
    <div class="form-field">
        <label for="nomeResponsavel">Nome do responsável</label>

        <input id="nomeResponsavel" type="text" pInputText formControlName="nomeResponsavel"
            placeholder="Nome do responsável">
    </div>


    <!-- Telefone do responsável -->
    <div class="form-field">
        <label for="telefoneResponsavel">Telefone do responsável</label>

        <input id="telefoneResponsavel" type="text" pInputText formControlName="telefoneResponsavel"
            placeholder="Telefone do responsável">
    </div>


    <!-- Data de nascimento -->
    <div class="form-field">
        <label for="dataNascimento">Data de nascimento</label>

        <p-datepicker id="dataNascimento" formControlName="dataNascimento" dateFormat="yy-mm-dd" [showIcon]="true">
        </p-datepicker>
    </div>


    <!-- Idade atual -->
    <div class="form-field">
        <label for="idadeAtual">Idade atual</label>

        <p-inputNumber id="idadeAtual" formControlName="idadeAtual" [useGrouping]="false">
        </p-inputNumber>
    </div>


    <!-- Status -->
    <div class="form-field">
        <label for="status">Status</label>

        <p-inputNumber id="status" formControlName="status" [useGrouping]="false">
        </p-inputNumber>
    </div>


    <!-- Botão pesquisar -->
    <div class="flex align-items-center justify-content-end">
        <button pButton id="btn-pesq" type="button" [icon]="loading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
            [disabled]="loading" (click)="pesquisar()" label="Pesquisar" class="font-medium">
        </button>
    </div>

</form>


<p-table [value]="lista" [scrollable]="true" sortMode="multiple" [resizableColumns]="true" [rowHover]="true"
    [(selection)]="selectedItem" selectionMode="single" dataKey="0" [virtualScroll]="true" [rows]="25">
    <ng-template pTemplate="header">
        <tr>
            <th pResizableColumn pSortableColumn="0" style="width: 120px">
                Código <p-sortIcon field="0"></p-sortIcon>
            </th>

            <th pResizableColumn pSortableColumn="1">
                Nome <p-sortIcon field="1"></p-sortIcon>
            </th>
            <th pResizableColumn pSortableColumn="2" style="width: 120px">
                CPF/CNPJ
                <p-sortIcon field="2"></p-sortIcon>
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-entity>
        <tr [pSelectableRow]="entity" (dblclick)="ref.close(entity[0])">
            <td>{{ entity[0] }}</td>
            <td>{{ entity[1] }}</td>
            <td>{{ entity[2] }}</td>
        </tr>
    </ng-template>
</p-table>

<div class="flex align-items-center justify-content-between">
    <span class="font-medium font-italic">Total de registros encontrados: {{lista}}</span>
    <div class="flex align-items-center gap-4">
        <button pButton label="Selecionar" (click)="selecionar()"></button>
    </div>
</div>
