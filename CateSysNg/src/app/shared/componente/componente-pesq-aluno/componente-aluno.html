<div class="flex gap-3">
    <form [formGroup]="form" class="p-inputgroup">
        <p-inputNumber #input class="input-code" [maxlength]="14" formControlName="matricula" (keydown)="keydown($event)" (onInput)="limpar()" [useGrouping]="false">
        </p-inputNumber>

        <input class="input-text" pInputText formControlName="nome" aria-hidden style="width: 150px;"/>

        <button type="button" pButton pRipple [icon]="loading ? 'pi pi-spin pi-spinner':'pi pi-search'" (click)="show()" [disabled]="disabled || loading" aria-hidden></button>
    </form>
    
    <div [formGroup]="form" *ngIf="enableCelular">
        <cmp-input-mask-wrapper class="input-text" styleClass="w-full input-text" mask="(99) 99999-9999" placeholder="Sem celular" formControlName="celular"></cmp-input-mask-wrapper>
    </div>
</div>
