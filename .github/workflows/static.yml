
name: Publicar CateSys no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CateSysNg/package-lock.json

      - name: Instalar dependências
        working-directory: CateSysNg
        run: npm ci

      - name: Compilar Angular
        working-directory: CateSysNg
        run: npm run build

      - name: Preparar site
        run: |
          mkdir -p public
          cp -r CateSysNg/dist/cateSysNg/browser/. public/
          touch public/.nojekyll
          echo '<base href="/WP-CateSys/">' > public/base-check.tmp
          rm public/base-check.tmp
          sed -i 's|<base href="/">|<base href="/WP-CateSys/">|' public/index.html

      - name: Carregar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
